<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Penguin's Helper</title>
<style>
  :root { --ink: #1b1b22; --muted: #6b7280; --hood: #e2312a; --string: #c9d3df;
    --ice: rgba(248, 251, 255, .78); --line: rgba(27, 27, 34, .08); }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--ink); user-select: none; }
  body { display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--hood); outline-offset: 2px; }

  /* the panel is a speech bubble the penguin holds up; the tail points at its head */
  #panel { display: none; position: relative; width: 296px; height: 296px; margin: 10px 12px 12px 0; box-sizing: border-box;
    flex-direction: column; background: var(--ice); border: 1px solid rgba(255, 255, 255, .9); border-radius: 18px;
    box-shadow: 0 0 0 1px var(--line), 0 8px 22px rgba(27, 27, 34, .16); }
  #panel::after { content: ""; position: absolute; right: 38px; bottom: -10px; width: 18px; height: 9px; background: var(--ice);
    clip-path: polygon(0 0, 100% 0, 50% 100%); }
  body.open #panel { display: flex; animation: open .18s ease-out; transform-origin: calc(100% - 47px) 100%; }
  @keyframes open { from { opacity: 0; transform: scale(.92) translateY(6px); } }

  header { display: flex; align-items: center; gap: 6px; padding: 10px 8px 8px 14px; }
  h1 { font: 600 14px/1 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; margin: 0; letter-spacing: -.01em; }
  #count { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: auto; }
  .icon { display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 8px; background: none; cursor: pointer; color: var(--muted); flex: none; }
  .icon:hover { background: rgba(27, 27, 34, .06); color: var(--ink); }
  .icon svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  #items { overflow-y: auto; flex: 1; padding: 0 6px 8px; scrollbar-width: thin; scrollbar-color: var(--string) transparent; }
  .item { position: relative; display: flex; align-items: center; gap: 8px; padding: 8px 6px 8px 12px; border-radius: 10px; cursor: pointer; }
  .item + .item { box-shadow: 0 -1px 0 var(--line); }
  .item:hover, .item:focus-visible { background: rgba(255, 255, 255, .85); box-shadow: none; outline: none; }
  .item:hover + .item, .item:focus-visible + .item { box-shadow: none; }
  /* red drawstring marks the row you're on */
  .item::before { content: ""; position: absolute; left: 4px; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--hood); opacity: 0; transition: opacity .12s; }
  .item:hover::before, .item:focus-visible::before { opacity: 1; }
  .item .text { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .item img { flex: 1; min-width: 0; max-height: 72px; object-fit: cover; object-position: top left; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); }
  .item .del { opacity: 0; }
  .item:hover .del, .item:focus-within .del { opacity: 1; }
  .item .del:hover { color: var(--hood); background: rgba(226, 49, 42, .08); }

  #hint { margin: 46px 24px 0; text-align: center; color: var(--muted); }
  kbd { display: inline-block; padding: 1px 6px; margin: 0 1px; border-radius: 5px; background: #fff; color: var(--ink);
    box-shadow: 0 0 0 1px var(--string), 0 1.5px 0 var(--string); font-family: inherit; font-size: 11px; font-weight: 600; line-height: 1.5; }

  #toast { position: absolute; left: 50%; bottom: 12px; transform: translate(-50%, 4px); padding: 5px 12px; border-radius: 999px;
    background: var(--ink); color: #fff; font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #penguin { width: 110px; height: 110px; cursor: pointer; border: 0; background: none; padding: 0; }
  /* walking away: waddle fast and slide off to the right, then only the peek tab is left */
  body.walk-out #penguin { animation: walk-out 1.3s ease-in forwards; }
  body.walk-in #penguin { animation: walk-out 1.3s ease-out reverse; }
  body.walk-out .sway, body.walk-in .sway { animation-duration: .22s; }
  @keyframes walk-out { to { transform: translateX(140px); } }
  #peek { display: none; position: fixed; inset: 0; border: 2px solid var(--ink); border-right: 0; border-radius: 12px 0 0 12px;
    background: var(--hood); cursor: pointer; padding: 0; }
  #peek span { position: absolute; left: 5px; top: 16px; width: 9px; height: 11px; border-radius: 50%; background: #fffaf2; }
  #peek span::after { content: ""; position: absolute; left: 2px; top: 3px; width: 3px; height: 4.5px; border-radius: 50%; background: var(--ink); }
  #peek:hover { filter: brightness(1.1); }
  body.away #penguin, body.away #panel { display: none; }
  body.away #peek { display: block; }
  #penguin.bounce { animation: bounce .35s; }
  @keyframes bounce { 50% { transform: translateY(-12px); } }
  /* idle: gentle side-to-side rock from the feet, plus a blink every few seconds */
  .sway { transform-box: view-box; transform-origin: 50px 94px; animation: sway 3.2s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-2.5deg) scaleY(1); } to { transform: rotate(2.5deg) scaleY(1.02); } }
  .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.7s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(.1); } }
  /* activities: JS sets data-act on #penguin; each shows one prop */
  .prop { display: none; transform-box: fill-box; transform-origin: 50% 100%; }
  #penguin[data-act="book"] .book, #penguin[data-act="code"] .code, #penguin[data-act="chess"] .chess { display: inline; animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } }
  .eyes { transition: transform .4s; }
  #penguin:not([data-act="idle"]) .eyes { transform: translateY(1.8px); } /* looking down at the prop */
  #penguin[data-act="chess"] .eyes { transform: translate(-1.2px, 1.8px); }
  .page { transform-box: view-box; transform-origin: 50px 75px; animation: flip 4s ease-in-out infinite; }
  @keyframes flip { 0%, 70% { transform: scaleX(1); } 90%, 100% { transform: scaleX(-1); opacity: .9; } }
  .glow { opacity: .35; animation: glow 2.3s ease-in-out infinite alternate; }
  @keyframes glow { to { opacity: .55; } }
  .sym { opacity: 0; animation: rise 3.4s ease-out infinite; }
  .sym2 { animation-delay: 1.7s; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(4px); } 20% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
  .tap { transform-box: fill-box; animation: tap .3s ease-in-out infinite alternate; }
  .tap2 { animation-delay: .15s; }
  @keyframes tap { to { transform: translateY(-1.5px); } }
  .hop { animation: hop 6s ease-in-out infinite; }
  @keyframes hop { 0%, 30% { transform: translate(0, 0); } 37% { transform: translate(-4px, -7px); } 44%, 75% { transform: translate(-8px, 0); } 82% { transform: translate(-4px, -7px); } 89%, 100% { transform: translate(0, 0); } }
  @media (prefers-reduced-motion: reduce) {
    .sway, .eye, #penguin.bounce, body.walk-out #penguin, body.walk-in #penguin, .prop, .page, .glow, .sym, .tap, .hop { animation: none !important; }
    .sym { opacity: 1; }
  }
</style>
</head>
<body>
  <div id="panel">
    <header>
      <h1>Clipboard</h1><span id="count"></span>
      <button class="icon" id="hide" title="Send the penguin away" aria-label="Hide penguin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c5 0 9 4.5 10 7a13 13 0 0 1-2.6 3.6M6.6 6.6C4.4 8 2.8 10.1 2 12c1 2.5 5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
      <button class="icon" id="quit" title="Quit Penguin's Helper" aria-label="Quit Penguin's Helper"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
      <button class="icon" id="close" title="Close" aria-label="Close clipboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    </header>
    <div id="items"></div>
    <div id="toast" role="status"></div>
  </div>
  <button id="penguin" title="Click me, then Ctrl+V" aria-label="Open clipboard">
    <!-- Based on the user's own hoodie-penguin tote bag drawing. -->
    <svg viewBox="0 0 100 100" width="110" height="110" aria-hidden="true">
      <defs>
        <!-- slight wobble so outlines feel hand-drawn like crayon -->
        <filter id="crayon"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter>
      </defs>
      <ellipse cx="50" cy="97" rx="24" ry="2.5" fill="#000" opacity=".15"/>
      <g class="sway">
      <g filter="url(#crayon)" stroke="#1b1b22" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
        <!-- belly peeking under the hoodie -->
        <path d="M29 76 Q29 92 50 92 Q71 92 71 76 Z" fill="#2b2d3a"/>
        <path d="M35 80 Q36 90 50 90 Q64 90 65 80 Z" fill="#fffaf2" stroke="none"/>
        <!-- feet -->
        <ellipse cx="40" cy="92" rx="6.5" ry="3.8" fill="#f39a1e" transform="rotate(-12 40 92)"/>
        <ellipse cx="61" cy="91.5" rx="6.5" ry="3.8" fill="#f39a1e" transform="rotate(12 61 91.5)"/>
        <!-- hoodie body -->
        <path d="M27 55 Q19 68 24 81 Q50 86 76 81 Q81 68 73 55 Z" fill="#e2312a"/>
        <path d="M30 63 Q28 72 31 79 M70 63 Q72 72 69 79" fill="none" stroke-width="1.6"/>
        <!-- hood -->
        <ellipse cx="50" cy="37" rx="31" ry="28" fill="#e2312a"/>
        <path d="M71 16 Q81 27 79 46" fill="none" stroke-width="1.4"/>
        <!-- head inside the hood -->
        <ellipse cx="50" cy="40" rx="24" ry="21.5" fill="#2b2d3a"/>
        <!-- face with the widow's peak -->
        <path d="M50 29 Q44 22 37 26 Q28 31 29.5 43 Q32 57 50 59 Q68 57 70.5 43 Q72 31 63 26 Q56 22 50 29 Z" fill="#fffaf2" stroke="none"/>
        <!-- drawstrings -->
        <path d="M44.5 60 L43.5 72 M55.5 60 L56.5 70" fill="none" stroke-width="4.2"/>
        <path d="M44.5 60 L43.5 72 M55.5 60 L56.5 70" fill="none" stroke="#c9d3df" stroke-width="2"/>
      </g>
      <!-- face details stay crisp -->
      <g class="eyes">
        <ellipse class="eye" cx="40" cy="41.5" rx="2" ry="2.8" fill="#1b1b22"/>
        <ellipse class="eye" cx="60" cy="41.5" rx="2" ry="2.8" fill="#1b1b22"/>
      </g>
      <ellipse cx="50" cy="47" rx="3.6" ry="2.6" fill="#f7d417" stroke="#1b1b22" stroke-width=".9"/>
      <path d="M46.8 47 H53.2" stroke="#1b1b22" stroke-width=".6"/>
      <path d="M34 50.5 l1.2 -2 M37 51 l1.2 -2 M62 51 l1.2 -2 M65 50.5 l1.2 -2" stroke="#e0605a" stroke-width="1.6" stroke-linecap="round"/>

      <!-- activity props: shown one at a time by data-act on #penguin -->
      <g class="prop book" stroke="#1b1b22" stroke-width="1.6" stroke-linejoin="round">
        <path d="M27 66 Q39 63 50 68 Q61 63 73 66 L73 83 Q61 80 50 85 Q39 80 27 83 Z" fill="#3b6fb6" filter="url(#crayon)"/>
        <path d="M30 66 Q40 63.5 50 68 L50 82 Q40 78 30 80.5 Z" fill="#fffaf2"/>
        <path d="M50 68 Q60 63.5 70 66 L70 80.5 Q60 78 50 82 Z" fill="#fffaf2"/>
        <path d="M33 69 L46 70.5 M33 72 L46 73.5 M33 75 L43 76 M54 70.5 L67 69 M54 73.5 L67 72 M54 76.5 L64 75.5" stroke="#9aa6b2" stroke-width=".9"/>
        <path class="page" d="M50 68 Q60 63.5 70 66 L70 80.5 Q60 78 50 82 Z" fill="#f3ece0"/>
        <ellipse cx="27" cy="75" rx="4" ry="6" fill="#2b2d3a"/>
        <ellipse cx="73" cy="75" rx="4" ry="6" fill="#2b2d3a"/>
      </g>
      <g class="prop code" stroke="#1b1b22" stroke-linejoin="round">
        <!-- screen glow on the chin: the screen faces the penguin, we see the lid's back -->
        <ellipse class="glow" cx="50" cy="57" rx="15" ry="3.5" fill="#7fd1ff" stroke="none"/>
        <ellipse class="tap" cx="28" cy="78" rx="4" ry="5" fill="#2b2d3a" stroke-width="1.4"/>
        <ellipse class="tap tap2" cx="72" cy="78" rx="4" ry="5" fill="#2b2d3a" stroke-width="1.4"/>
        <rect x="29" y="60" width="42" height="23" rx="3" fill="#c9d3df" stroke-width="1.8" filter="url(#crayon)"/>
        <path d="M27 83 H73 L74.5 86 H25.5 Z" fill="#8f9aa8" stroke-width="1.4"/>
        <!-- fish sticker on the lid -->
        <path d="M44 71.5 Q50 66.5 55 71.5 Q50 76.5 44 71.5 Z M55 71.5 L58.5 68.5 V74.5 Z" fill="#f39a1e" stroke-width="1"/>
        <circle cx="47" cy="71" r=".8" fill="#1b1b22" stroke="none"/>
        <g fill="#3b6fb6" stroke="none" font-family="Consolas, monospace" font-weight="700" font-size="7">
          <text class="sym" x="79" y="70">&lt;/&gt;</text>
          <text class="sym sym2" x="6" y="72">{ }</text>
        </g>
      </g>
      <g class="prop chess" stroke="#1b1b22" stroke-linejoin="round">
        <defs><pattern id="checks" x="26" y="76" width="12" height="12" patternUnits="userSpaceOnUse">
          <rect width="12" height="12" fill="#f1e3c6"/><rect width="6" height="6" fill="#c49a6c"/><rect x="6" y="6" width="6" height="6" fill="#c49a6c"/>
        </pattern></defs>
        <rect x="26" y="76" width="48" height="15" rx="1.5" fill="url(#checks)" stroke-width="1.8"/>
        <ellipse cx="25" cy="83" rx="4" ry="5.5" fill="#2b2d3a" stroke-width="1.4"/>
        <ellipse cx="75" cy="83" rx="4" ry="5.5" fill="#2b2d3a" stroke-width="1.4"/>
        <!-- dark king, waiting -->
        <path d="M33 80 h5 l-1 -6 h-3 Z M35.5 74 v-4 M34 71.5 h3" fill="#2b2d3a" stroke-width="1.2" stroke-linecap="round"/>
        <!-- white pawn that keeps hopping -->
        <g class="hop"><path d="M52 81 h6 l-1.5 -5 h-3 Z" fill="#fffaf2" stroke-width="1.2"/><circle cx="55" cy="74.5" r="2.4" fill="#fffaf2" stroke-width="1.2"/></g>      </g>
      </g>
    </svg>
  </button>
  <button id="peek" title="Bring the penguin back" aria-label="Show penguin"><span></span></button>
<script>
  const $ = (s) => document.querySelector(s);
  let toastTimer;
  const toast = (m) => {
    const t = $('#toast'); clearTimeout(toastTimer);
    t.textContent = m || ''; t.classList.toggle('show', !!m);
    if (m) toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  };

  function render(list) {
    const box = $('#items');
    box.innerHTML = '';
    $('#count').textContent = list.length || '';
    if (!list.length) { box.innerHTML = '<div id="hint">Copy something, then click me and press <kbd>Ctrl</kbd>+<kbd>V</kbd> to keep it here.</div>'; return; }
    list.forEach((e, i) => {
      const row = document.createElement('div');
      row.className = 'item'; row.tabIndex = 0; row.title = 'Click to copy';
      if (e.type === 'text') {
        const s = document.createElement('span'); s.className = 'text'; s.textContent = e.text; row.append(s);
      } else {
        const img = document.createElement('img');
        img.src = e.data; img.alt = 'Copied image';
        row.append(img);
      }
      const del = document.createElement('button');
      del.className = 'icon del'; del.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V4h6v3"/></svg>'; del.title = 'Delete'; del.setAttribute('aria-label', 'Delete');
      del.onclick = async (ev) => { ev.stopPropagation(); render(await penguin.remove(i)); toast('Deleted'); };
      row.append(del);
      const copy = async () => toast((await penguin.copy(i)) || 'Copied');
      row.onclick = copy;
      row.onkeydown = (ev) => { if (ev.key === 'Enter') copy(); };
      box.append(row);
    });
  }

  const toggle = async () => {
    document.body.classList.toggle('open', await penguin.toggle());
    toast('');
  };
  $('#penguin').onclick = toggle;

  // Pick a new random activity every 9-18s, never the same one twice in a row.
  const acts = ['idle', 'book', 'code', 'chess'];
  (function nextAct() {
    const p = $('#penguin'), choices = acts.filter((a) => a !== p.dataset.act);
    p.dataset.act = choices[Math.floor(Math.random() * choices.length)];
    setTimeout(nextAct, 9000 + Math.random() * 9000);
  })();
  $('#close').onclick = toggle;

  // Hide: close the panel, waddle off, then shrink to the peek tab. The tab brings it back.
  // Order matters: resize only while the penguin is off-window, so nothing flashes.
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const walkEnd = () => new Promise((done) => {
    if (reduced) return done();
    const p = $('#penguin');
    p.addEventListener('animationend', function end(ev) {
      if (ev.target !== p) return; // ignore the svg's own animations bubbling up
      p.removeEventListener('animationend', end); done();
    });
  });
  const cls = document.body.classList;
  $('#hide').onclick = async () => {
    if (cls.contains('open')) await toggle();
    $('#penguin').classList.remove('bounce'); // its animation would override the walk
    cls.add('walk-out'); await walkEnd();
    await penguin.hide();
    cls.add('away'); cls.remove('walk-out');
  };
  $('#peek').onclick = async () => {
    cls.add('walk-in'); cls.remove('away');
    await penguin.show();
    await walkEnd(); cls.remove('walk-in');
  };
  $('#quit').onclick = () => penguin.quit();

  // Only fires while this window has focus: no global keyboard hooks.
  document.addEventListener('keydown', async (ev) => {
    if (!(ev.ctrlKey && ev.key.toLowerCase() === 'v')) return;
    ev.preventDefault();
    const { list, error } = await penguin.paste();
    render(list); toast(error || 'Added');
    const p = $('#penguin'); p.classList.remove('bounce'); void p.offsetWidth; p.classList.add('bounce');
  });

  penguin.list().then(render);
</script>
</body>
</html>
