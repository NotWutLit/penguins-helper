<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Penguin's Helper</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font: 13px system-ui, sans-serif; user-select: none; }
  body { display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; }
  #panel { display: none; width: 300px; height: 300px; margin: 0 4px 4px 0; background: #f4f8fb;
    border: 2px solid #1d2b3a; border-radius: 12px; box-sizing: border-box; flex-direction: column; }
  body.open #panel { display: flex; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px;
    border-bottom: 1px solid #cfdbe5; font-weight: 600; color: #1d2b3a; }
  header button { border: 0; background: none; font-size: 15px; cursor: pointer; color: #1d2b3a; }
  #items { overflow-y: auto; flex: 1; padding: 4px; }
  .item { display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 8px; cursor: pointer; }
  .item:hover, .item:focus { background: #dde9f3; outline: none; }
  .item span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .item img { max-width: 200px; max-height: 70px; border-radius: 4px; flex: 1; object-fit: contain; object-position: left; }
  .item button { border: 0; background: none; cursor: pointer; font-size: 14px; }
  #hint, #toast { color: #5a6b7b; padding: 8px 10px; }
  #toast { min-height: 1em; padding-top: 0; }
  #penguin { width: 110px; height: 110px; cursor: pointer; border: 0; background: none; padding: 0; }
  #penguin.bounce { animation: bounce .35s; }
  @keyframes bounce { 50% { transform: translateY(-12px); } }
</style>
</head>
<body>
  <div id="panel">
    <header>Clipboard <span><button id="quit" title="Quit Penguin's Helper">Quit</button> <button id="close" title="Close panel" aria-label="Close panel">✕</button></span></header>
    <div id="items"></div>
    <div id="toast" role="status"></div>
  </div>
  <button id="penguin" title="Click me, then Ctrl+V" aria-label="Open clipboard">
    <svg viewBox="0 0 100 100" width="110" height="110" aria-hidden="true">
      <ellipse cx="50" cy="94" rx="26" ry="4" fill="#000" opacity=".15"/>
      <ellipse cx="50" cy="58" rx="30" ry="34" fill="#1d2b3a"/>
      <ellipse cx="50" cy="64" rx="20" ry="26" fill="#fff"/>
      <ellipse cx="20" cy="62" rx="7" ry="16" fill="#1d2b3a" transform="rotate(15 20 62)"/>
      <ellipse cx="80" cy="62" rx="7" ry="16" fill="#1d2b3a" transform="rotate(-15 80 62)"/>
      <circle cx="41" cy="40" r="4" fill="#fff"/><circle cx="59" cy="40" r="4" fill="#fff"/>
      <circle cx="42" cy="41" r="2" fill="#000"/><circle cx="58" cy="41" r="2" fill="#000"/>
      <path d="M44 48 L56 48 L50 55 Z" fill="#f5a623"/>
      <ellipse cx="40" cy="91" rx="8" ry="3.5" fill="#f5a623"/>
      <ellipse cx="60" cy="91" rx="8" ry="3.5" fill="#f5a623"/>
    </svg>
  </button>
<script>
  const $ = (s) => document.querySelector(s);
  const toast = (m) => { $('#toast').textContent = m || ''; };

  function render(list) {
    const box = $('#items');
    box.innerHTML = '';
    if (!list.length) { box.innerHTML = '<div id="hint">Copy something, then press Ctrl+V here.</div>'; return; }
    list.forEach((e, i) => {
      const row = document.createElement('div');
      row.className = 'item'; row.tabIndex = 0; row.title = 'Click to copy';
      if (e.type === 'text') {
        const s = document.createElement('span'); s.textContent = e.text; row.append(s);
      } else {
        const img = document.createElement('img');
        img.src = 'file:///' + e.path.replace(/\\/g, '/'); img.alt = 'Screenshot';
        const b = document.createElement('button'); b.textContent = '📁'; b.title = 'Show in folder';
        b.setAttribute('aria-label', 'Show in folder');
        b.onclick = (ev) => { ev.stopPropagation(); penguin.reveal(i); };
        row.append(img, b);
      }
      const copy = async () => toast((await penguin.copy(i)) || 'Copied!');
      row.onclick = copy;
      row.onkeydown = (ev) => { if (ev.key === 'Enter') copy(); };
      box.append(row);
    });
  }

  const toggle = async () => {
    document.body.classList.toggle('open', await penguin.toggle());
    toast('');
  };
  $('#penguin').onclick = toggle;
  $('#close').onclick = toggle;
  $('#quit').onclick = () => penguin.quit();

  // Only fires while this window has focus: no global keyboard hooks.
  document.addEventListener('keydown', async (ev) => {
    if (!(ev.ctrlKey && ev.key.toLowerCase() === 'v')) return;
    ev.preventDefault();
    const { list, error } = await penguin.paste();
    render(list); toast(error || 'Saved!');
    const p = $('#penguin'); p.classList.remove('bounce'); void p.offsetWidth; p.classList.add('bounce');
  });

  penguin.list().then(render);
</script>
</body>
</html>
